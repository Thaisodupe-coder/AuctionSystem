name: Auction System CI/CD

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:13
        env:
          POSTGRES_DB: auctionsystem
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: admin
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 11
      uses: actions/setup-java@v4
      with:
        java-version: '11'
        distribution: 'temurin'
        cache: maven

    - name: Build and Test with Maven
      run: |
        cd auctionsystem
        mvn clean compile
        mvn test
      env:
        DB_URL: jdbc:postgresql://localhost:5432/auctionsystem
        DB_USER: postgres
        DB_PASSWORD: admin

  release:
    needs: build-and-test
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 11
      uses: actions/setup-java@v4
      with:
        java-version: '11'
        distribution: 'temurin'
        cache: maven

    - name: Package Application
      run: |
        cd auctionsystem
        mvn package -DskipTests

    - name: Create GitHub Release
      id: create_release
      uses: softprops/action-gh-release@v1
      with:
        files: |
          auctionsystem/target/*.jar
        name: Release ${{ github.ref_name }}
        body: |
          Bản phát hành tự động cho phiên bản ${{ github.ref_name }}.
          
          Hướng dẫn chạy:
          1. Đảm bảo đã bật PostgreSQL (Docker).
          2. Chạy Server: `java -cp auctionsystem-${{ github.ref_name }}.jar com.auction.server.AuctionServer`
          3. Chạy Client: Sử dụng lệnh Maven javafx:run hoặc package tương ứng.
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
